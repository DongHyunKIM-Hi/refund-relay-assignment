<svg viewBox="0 0 900 440" width="900" height="440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="시간 초과 후 같은 refundId로 재시도하는 흐름: 결제대행사는 실제로 환불을 처리했지만 응답이 늦어 워커는 실패로 판단한다. 같은 ID로 재시도하면 결제대행사가 이미 처리된 건이라고 응답해 환불이 한 번만 처리된다">
<title>시간 초과 후 재시도 흐름</title>
<desc>처리 워커가 refundId R-1로 환불을 요청한다. 결제대행사는 환불을 처리했지만 응답이 늦어 워커는 시간 초과로 판단한다. 워커가 같은 ID로 재시도하면 결제대행사는 alreadyProcessed true를 응답하고, 워커는 환불을 새로 만들지 않는다.</desc>
<rect width="900" height="440" fill="#ffffff"/>

<defs>
  <marker id="sq-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="sq-arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
  </marker>
  <marker id="sq-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
  </marker>
</defs>

<!-- 참여자 -->
<rect x="140" y="20" width="200" height="50" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
<text x="240" y="51" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12" font-family="sans-serif">처리 워커</text>
<rect x="560" y="20" width="200" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="660" y="51" text-anchor="middle" font-size="14" font-weight="700" fill="#334155" font-family="sans-serif">가상 결제대행사</text>

<!-- 생명선 -->
<line x1="240" y1="70" x2="240" y2="425" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="660" y1="70" x2="660" y2="425" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>

<!-- 1. 첫 요청 -->
<text x="40" y="112" font-size="12" font-weight="700" fill="#94a3b8" font-family="sans-serif">1</text>
<line x1="240" y1="110" x2="657" y2="110" stroke="#2563eb" stroke-width="2" marker-end="url(#sq-arrow-blue)"/>
<text x="450" y="100" text-anchor="middle" font-size="12" fill="#1d4ed8" font-family="ui-monospace, Menlo, monospace">POST /pg/refunds (refundId = R-1)</text>

<!-- 2. 결제대행사 처리 -->
<text x="40" y="157" font-size="12" font-weight="700" fill="#94a3b8" font-family="sans-serif">2</text>
<rect x="560" y="132" width="230" height="44" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
<text text-anchor="middle" font-family="sans-serif" fill="#713f12">
  <tspan x="675" y="151" font-size="12">환불은 실제로 처리했지만</tspan>
  <tspan x="675" y="167" font-size="12">응답이 매우 늦음</tspan>
</text>

<!-- 3. 시간 초과 -->
<text x="40" y="217" font-size="12" font-weight="700" fill="#94a3b8" font-family="sans-serif">3</text>
<rect x="110" y="192" width="260" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
<text text-anchor="middle" font-family="sans-serif" fill="#991b1b">
  <tspan x="240" y="211" font-size="12">응답 대기 시간 초과</tspan>
  <tspan x="240" y="227" font-size="12">실패로 판단하고 재시도 준비</tspan>
</text>

<!-- 4. 같은 ID로 재시도 -->
<text x="40" y="282" font-size="12" font-weight="700" fill="#94a3b8" font-family="sans-serif">4</text>
<line x1="240" y1="280" x2="657" y2="280" stroke="#ea580c" stroke-width="2" marker-end="url(#sq-arrow-orange)"/>
<text x="450" y="270" text-anchor="middle" font-size="12" fill="#c2410c" font-family="ui-monospace, Menlo, monospace">POST /pg/refunds (refundId = R-1)</text>
<text x="450" y="298" text-anchor="middle" font-size="11.5" fill="#c2410c" font-family="sans-serif">새 ID가 아니라 같은 ID로 재시도</text>

<!-- 5. 이미 처리됨 응답 -->
<text x="40" y="337" font-size="12" font-weight="700" fill="#94a3b8" font-family="sans-serif">5</text>
<line x1="660" y1="335" x2="243" y2="335" stroke="#15803d" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#sq-arrow-green)"/>
<text x="450" y="325" text-anchor="middle" font-size="12" fill="#15803d" font-family="ui-monospace, Menlo, monospace">200 OK, alreadyProcessed: true</text>

<!-- 6. 결과 -->
<text x="40" y="392" font-size="12" font-weight="700" fill="#94a3b8" font-family="sans-serif">6</text>
<rect x="110" y="367" width="260" height="44" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
<text text-anchor="middle" font-family="sans-serif" fill="#166534">
  <tspan x="240" y="386" font-size="12">이미 처리된 건임을 확인</tspan>
  <tspan x="240" y="402" font-size="12">새 ID로 다시 요청하지 않고 COMPLETED</tspan>
</text>
</svg>
